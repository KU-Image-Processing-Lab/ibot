# reference: https://zenn.dev/hironobuu/articles/a7684fcf61231e
name: Python Lint and Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]
    paths:
      - "**.py"

jobs:
  formatter:
    permissions:
      contents: write
    uses: ./.github/workflows/formatter.yml

  lint-and-test:
    needs: formatter
    permissions:
      contents: read
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout formatted code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - run: pip install flake8==6.0.0
      - run: pip install flake8-docstrings flake8-simplify flake8-unused-arguments flake8-quotes
      - name: flake8 Lint
        uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify slack when job failed
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@25e41412fd45a59ddd15477c38c78942ba97b50b
        with:
          payload: |
            {
              "url": "${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}",
              "workflow": "${{github.workflow}}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
